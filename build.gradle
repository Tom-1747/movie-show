import org.apache.tools.ant.taskdefs.condition.Os
import org.openapitools.generator.gradle.plugin.tasks.GenerateTask

plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.2'
    id 'io.spring.dependency-management' version '1.1.3'
    id 'org.openapi.generator' version '7.7.0'
    id 'jacoco'
    id 'io.freefair.lombok' version '8.6'
}

jacoco {
    toolVersion = "0.8.11"
}

repositories {
    mavenCentral()
}

java {
    group = 'com.movie.demo'
    sourceCompatibility = '21'
    targetCompatibility = '21'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

test {
    maxParallelForks = Runtime.runtime.availableProcessors().intdiv(2) ?: 1
    useJUnitPlatform()
    finalizedBy jacocoTestCoverageVerification
}

jacocoTestCoverageVerification {
    dependsOn test
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                    "**/gen/**"
            ])
        }))
    }
    violationRules {
        rule {
            limit {
                counter = "LINE"
                minimum = 0.8
            }
        }
    }
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    reports {
        xml.required = true
        html.required = true
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                    "**/gen/**"
            ])
        }))
    }
    doLast {
        def coverageReportFile = file("$rootDir/build/reports/jacoco/test/jacocoTestReport.xml")
        if (coverageReportFile.exists()) {
            def xmlParser = new XmlParser()
            xmlParser.setFeature("http://apache.org/xml/features/nonvalidating/load-external-dtd", false)
            xmlParser.setFeature("http://apache.org/xml/features/disallow-doctype-decl", false)
            def xml = xmlParser.parse(coverageReportFile)
            def lineCounter = xml.'counter'.find { it.@type == 'LINE' }
            if (lineCounter != null) {
                def totalLines = lineCounter.@missed?.toInteger() + lineCounter.@covered?.toInteger() ?: 0
                def coverageRate = (totalLines > 0) ? (lineCounter.@covered?.toInteger() / totalLines * 100).intdiv(1) : 0
                println "JaCoCo Coverage Rate: ${coverageRate}%"
            }
        }
    }
}

dependencyManagement {
    imports {
        mavenBom "org.testcontainers:testcontainers-bom:1.20.2"
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.postgresql:postgresql:42.6.0'
    
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.junit-pioneer:junit-pioneer:2.2.0'
}

tasks.withType(GenerateTask) {
    configure(it) {
        generatorName = "spring"
        configOptions = [
            'interfaceOnly'        : 'true',
            'dateLibrary'          : 'java8',
            'library'              : 'spring-boot',
            'useSpringBoot3'       : 'true',
            'serializableModel'    : 'true',
            'useJakartaEe'         : 'true',
            'withXml'              : 'true',
        ]
    }
}

openApiGenerate {
    inputSpec = "$rootDir/show.yaml".toString()
    outputDir = "$rootDir/build/generated".toString()
    configOptions = [
        'interfaceOnly'        : 'true',
        'dateLibrary'          : 'java8',
        'library'              : 'spring-boot',
        'useSpringBoot3'       : 'true',
        'serializableModel'    : 'true',
        'useJakartaEe'         : 'true',
        'withXml'              : 'true',
    ]
    generatorName = "spring"
}
