tasks.withType(GenerateTask) {
    configure(it) {
        generatorName = "spring"
        configOptions = [
            'interfaceOnly'        : 'true',
            'dateLibrary'          : 'java8',
            'library'              : 'spring-boot',
            'useSpringBoot3'       : 'true',
            'serializableModel'    : 'true',
            'useJakartaEe'         : 'true',
            'withXml'              : 'true',
        ]
    }
}

openApiGenerate {
    inputSpec = "$rootDir/show.yaml".toString()
    outputDir = "$rootDir/build/generated".toString()
    configOptions = [
        'interfaceOnly'        : 'true',
        'dateLibrary'          : 'java8',
        'library'              : 'spring-boot',
        'useSpringBoot3'       : 'true',
        'serializableModel'    : 'true',
        'useJakartaEe'         : 'true',
        'withXml'              : 'true',
    ]
    generatorName = "spring"
}
